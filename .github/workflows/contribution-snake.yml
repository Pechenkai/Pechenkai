name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Pechenkai
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E11D48&color_dots=%23EBEDF0,%23C6E7D4,%2372D6A0,%2322A06B,%23087F5B
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFB000&color_dots=%23161B22,%231E3A5F,%230C4A6E,%230891B2,%2322D3EE

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
